<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sameer Exports logo: original and polished</title>
    <style>
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: #111419; background: #fbfaf7; }
      main { max-width: 72rem; margin: 0 auto; padding: 2rem 1.5rem 4rem; display: grid; gap: 2.5rem; }
      h1 { margin: 0; font-size: 1.6rem; }
      h2 { margin: 0 0 0.75rem; font-size: 1rem; }
      .row { display: flex; flex-wrap: wrap; gap: 1rem; }
      figure { margin: 0; display: grid; gap: 0.5rem; justify-items: center; padding: 1.25rem; border: 1px solid #e3e0d8; border-radius: 6px; background: #fff; }
      figure.dark { background: #14161d; border-color: #14161d; color: #e9e9ee; }
      figure.photo { background: linear-gradient(135deg, #6b5a3e, #2b2620 60%, #8a7650); border-color: transparent; color: #fff; }
      figcaption { font-size: 0.8rem; opacity: 0.75; }
      .big img { height: 260px; }
      .sizes { align-items: end; }
      .sizes img { display: block; }
      .lockup img { height: 72px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sameer Exports logo: original and polished</h1>

      <section>
        <h2>Original next to the polished mark</h2>
        <div class="row big">
          <figure><img src="../Sameer%20Exports%20logo.png" alt="Original logo" /><figcaption>Original PNG, on white</figcaption></figure>
          <figure><img src="sameer-exports-mark.svg" alt="Polished logo" /><figcaption>Polished, on white</figcaption></figure>
          <figure class="dark"><img src="../Sameer%20Exports%20logo.png" alt="Original logo" /><figcaption>Original on dark (white fringe)</figcaption></figure>
          <figure class="dark"><img src="sameer-exports-mark.svg" alt="Polished logo" /><figcaption>Polished on dark</figcaption></figure>
        </div>
      </section>

      <section>
        <h2>Variants</h2>
        <div class="row big">
          <figure><img src="sameer-exports-mark-flat.svg" alt="Flat mark" /><figcaption>Flat (web, small sizes)</figcaption></figure>
          <figure><img src="sameer-exports-mark-black.svg" alt="Black mark" /><figcaption>One colour, black</figcaption></figure>
          <figure class="dark"><img src="sameer-exports-mark-white.svg" alt="White mark" /><figcaption>One colour, white</figcaption></figure>
          <figure class="photo"><img src="sameer-exports-mark-white.svg" alt="White mark on a photo" /><figcaption>White on a photo</figcaption></figure>
        </div>
      </section>

      <section>
        <h2>Logo with name</h2>
        <div class="row lockup">
          <figure><img src="sameer-exports-logo.svg" alt="Sameer Exports logo with name" /><figcaption>On light</figcaption></figure>
          <figure class="dark"><img src="sameer-exports-logo-white.svg" alt="Sameer Exports logo with name, white" /><figcaption>On dark</figcaption></figure>
        </div>
      </section>

      <section>
        <h2>Small sizes (16, 24, 32, 48, 64 px tall)</h2>
        <div class="row sizes">
          <figure><div class="row sizes"><img src="sameer-exports-mark-flat.svg" height="16" alt="" /><img src="sameer-exports-mark-flat.svg" height="24" alt="" /><img src="sameer-exports-mark-flat.svg" height="32" alt="" /><img src="sameer-exports-mark-flat.svg" height="48" alt="" /><img src="sameer-exports-mark-flat.svg" height="64" alt="" /></div><figcaption>Flat</figcaption></figure>
          <figure><div class="row sizes"><img src="sameer-exports-mark.svg" height="16" alt="" /><img src="sameer-exports-mark.svg" height="24" alt="" /><img src="sameer-exports-mark.svg" height="32" alt="" /><img src="sameer-exports-mark.svg" height="48" alt="" /><img src="sameer-exports-mark.svg" height="64" alt="" /></div><figcaption>Full mark</figcaption></figure>
          <figure><div class="row sizes"><img src="../Sameer%20Exports%20logo.png" height="16" alt="" /><img src="../Sameer%20Exports%20logo.png" height="24" alt="" /><img src="../Sameer%20Exports%20logo.png" height="32" alt="" /><img src="../Sameer%20Exports%20logo.png" height="48" alt="" /><img src="../Sameer%20Exports%20logo.png" height="64" alt="" /></div><figcaption>Original</figcaption></figure>
        </div>
      </section>
    </main>
  </body>
</html>
